<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E6B58">
<meta name="description" content="Game nhập vai du lịch xuyên Việt: check-in, ăn đặc sản, sưu tầm dấu hộ chiếu.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Xuyên Việt">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Xuyên Việt Ký</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sticky HUD band on top; S-shaped map beside an action panel on desktop, stacked on phones */
:root{
  --bg:#EDF1EA; --surface:#FFFFFF; --surface-2:#E4EAE2; --ink:#1B2622; --muted:#5A6A63; --line:#CAD4CB;
  --jade:#1E6B58; --jade-soft:#D3E7DF; --sun:#D99A12; --sun-soft:#FBEFCF; --red:#BF3328; --red-soft:#F6DCD8;
  --sea:#D5E6E8; --land:#F8F5E7; --land-line:#93A99C; --on-accent:#FFFFFF;
  --f-display:'Bungee','Be Vietnam Pro',system-ui,sans-serif;
  --f-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101715; --surface:#18211E; --surface-2:#212C28; --ink:#E4ECE7; --muted:#93A49C; --line:#2F3D37;
  --jade:#4DB596; --jade-soft:#1C3A31; --sun:#F0B53A; --sun-soft:#3A2F14; --red:#E5594C; --red-soft:#3E1F1C;
  --sea:#132629; --land:#1F2B26; --land-line:#4A6359; --on-accent:#0E1513; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101715; --surface:#18211E; --surface-2:#212C28; --ink:#E4ECE7; --muted:#93A49C; --line:#2F3D37;
  --jade:#4DB596; --jade-soft:#1C3A31; --sun:#F0B53A; --sun-soft:#3A2F14; --red:#E5594C; --red-soft:#3E1F1C;
  --sea:#132629; --land:#1F2B26; --land-line:#4A6359; --on-accent:#0E1513; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.hud-in{max-width:1180px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px}
.brand{font-family:var(--f-display);font-size:20px;letter-spacing:.02em;color:var(--jade);line-height:1}
.brand small{display:block;font-family:var(--f-body);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px;font-weight:600}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--red);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-display);font-size:16px;flex:none}
.who b{display:block;font-size:14px;line-height:1.2}
.who span{font-size:12px;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-left:auto}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--f-mono);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.bar{width:110px;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--jade);transition:width .3s}
.bar.e i{background:var(--sun)}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--muted)}
.ghost:hover{color:var(--ink);border-color:var(--muted)}

.wrap{max-width:1180px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:18px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}}

.mapbox{background:var(--sea);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
.mapbox svg{display:block;width:100%;height:auto;max-height:78vh}
.maphint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.land{fill:var(--land);stroke:var(--land-line);stroke-width:1.4;stroke-linejoin:round}
.route{fill:none;stroke:var(--red);stroke-width:2.2;stroke-dasharray:5 5;stroke-linecap:round;opacity:.85}
.city{cursor:pointer}
.city circle.dot{fill:var(--surface);stroke:var(--jade);stroke-width:2.2}
.city.v circle.dot{fill:var(--jade)}
.city.dest circle.dot{stroke:var(--sun);stroke-width:3.2}
.city text{font-size:12.5px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3.5px;stroke-linejoin:round}
.city:hover text{fill:var(--jade)}
.here-ring{fill:none;stroke:var(--red);stroke-width:2.5}
.pulse{fill:var(--red);opacity:.25;transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{from{transform:scale(.6);opacity:.45}to{transform:scale(2.2);opacity:0}}
.isl text{font-size:11px;fill:var(--muted);font-weight:600;font-style:italic}
.isl circle{fill:var(--land-line)}
.compass{font-family:var(--f-display);font-size:13px;fill:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--surface-2)}
.tabs button{flex:1;background:none;border:0;padding:11px 6px;font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red);background:var(--surface)}
.pbody{padding:18px;display:flex;flex-direction:column;gap:18px}

.cityhead h2{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.1;margin:0;color:var(--ink);text-wrap:balance}
.cityhead .prov{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--jade);font-weight:700;margin-top:6px}
.cityhead p{margin:8px 0 0;color:var(--muted);max-width:60ch}
.sec h3{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:700}
.rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;font-size:14.5px;line-height:1.3}
.row .t span{font-size:12.5px;color:var(--muted)}
.btn{border:0;border-radius:8px;padding:8px 12px;font-weight:600;font-size:13.5px;background:var(--jade);color:var(--on-accent);white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.sun{background:var(--sun);color:#1B1606}
.btn.out{background:none;border:1.5px solid var(--jade);color:var(--jade)}
.btn:disabled{background:var(--surface-2);color:var(--muted);cursor:not-allowed;filter:none;border-color:transparent}
.chip{font-size:12px;font-weight:700;color:var(--jade);background:var(--jade-soft);border-radius:999px;padding:4px 10px;white-space:nowrap}
.chip.red{color:var(--red);background:var(--red-soft)}
.quiz{border:1px dashed var(--sun);background:var(--sun-soft);border-radius:10px;padding:12px}
.quiz b{display:block;margin-bottom:8px}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:420px){.qopts{grid-template-columns:1fr}}
.qopts button{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:left;font-size:13.5px}
.qopts button:hover{border-color:var(--sun)}
.rest{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rest button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.rest button b{display:block;font-size:14px}
.rest button span{font-size:12.5px;color:var(--muted)}
.rest button:hover{border-color:var(--jade)}
.rest button:disabled{opacity:.5;cursor:not-allowed}

.dlist{display:flex;flex-direction:column;gap:6px}
.dest{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;text-align:left;width:100%}
.dest:hover{border-color:var(--jade)}
.dest.sel{border-color:var(--sun);background:var(--sun-soft)}
.dest b{flex:1;font-weight:600}
.dest .km{font-size:12.5px;color:var(--muted)}
.vtag{width:9px;height:9px;border-radius:50%;border:2px solid var(--jade);flex:none}
.vtag.on{background:var(--jade)}
.modes{display:flex;flex-direction:column;gap:8px}
.mode{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.mode b{font-size:14.5px}
.mode .meta{grid-column:1;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.mode .btn{grid-row:1 / span 2;grid-column:2}
.mode .why{grid-column:1 / -1;font-size:12px;color:var(--red)}

.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:12px}
.stamp{border:2px dashed var(--line);border-radius:12px;padding:12px 8px;text-align:center;min-height:118px;display:flex;flex-direction:column;justify-content:center;gap:4px;color:var(--muted)}
.stamp.on{border:2.5px double var(--red);color:var(--red);transform:rotate(-3deg);background:var(--red-soft)}
.stamp:nth-child(even).on{transform:rotate(2.5deg)}
.stamp .sn{font-family:var(--f-display);font-size:14px;line-height:1.15}
.stamp .sd{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.stamp .sp{font-size:11.5px;color:var(--muted)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.summary div{background:var(--surface-2);border-radius:10px;padding:10px}
.summary b{display:block;font-family:var(--f-mono);font-size:20px}
.summary span{font-size:12px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px}
.log div{padding:6px 0 6px 14px;position:relative;font-size:14px}
.log div::before{content:"";position:absolute;left:-6px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--jade)}
.log div.bad::before{border-color:var(--red)}
.log div.good::before{border-color:var(--sun)}
.log time{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-right:8px}
.note{font-size:12px;color:var(--muted)}
.win{background:var(--jade);color:var(--on-accent);border-radius:10px;padding:14px}
.win b{font-family:var(--f-display);font-weight:400;font-size:18px;display:block}

.toast{z-index:50!important;position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:min(92vw,520px);opacity:0;pointer-events:none;transition:.25s;z-index:30}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.modal{position:fixed;inset:0;z-index:40;background:rgba(10,20,16,.55);display:grid;place-items:center;padding:16px;overflow:auto}
.card{background:var(--surface);color:var(--ink);border-radius:16px;max-width:560px;width:100%;padding:22px;display:flex;flex-direction:column;gap:16px;border:1px solid var(--line)}
.card h1{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.05;margin:0;color:var(--jade)}
.card .lead{margin:0;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.field input,.field select{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.arch{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:440px){.arch{grid-template-columns:1fr}}
.arch label{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:block}
.arch input{position:absolute;opacity:0;pointer-events:none}
.arch label:has(input:checked){border-color:var(--red);background:var(--red-soft)}
.arch label:has(input:focus-visible){outline:2px solid var(--sun);outline-offset:2px}
.arch b{display:block;font-size:14.5px}
.arch span{font-size:12.5px;color:var(--muted)}
.cta{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.btn.big{padding:12px 20px;font-size:15px}
/* Nhân vật & cảnh */
.hero-g{pointer-events:none}
.lg,.arm{transform-box:fill-box;transform-origin:50% 0}
.walk .l1{animation:legA .32s ease-in-out infinite alternate}
.walk .l2{animation:legA .32s ease-in-out infinite alternate-reverse}
.walk .a1{animation:legA .32s ease-in-out infinite alternate-reverse}
@keyframes legA{from{transform:rotate(28deg)}to{transform:rotate(-28deg)}}
.riding .legs{display:none}
.bob{animation:bob .22s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-1.2px)}}
.breathe{animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(-1.2px)}}
.wave .a2{animation:wave .45s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-150deg)}to{transform:rotate(-110deg)}}
.raise .a2{transform:rotate(-140deg)}
.flash{animation:flash .9s ease-out 2}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.steam{animation:steam 1.4s ease-in-out infinite}
@keyframes steam{0%{opacity:0;transform:translateY(2px)}50%{opacity:.8}100%{opacity:0;transform:translateY(-5px)}}
.zzz{animation:zzz 1.6s ease-in-out infinite}
@keyframes zzz{0%{opacity:0;transform:translate(0,4px)}50%{opacity:1}100%{opacity:0;transform:translate(6px,-8px)}}
.pop{animation:pop .3s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.pop,.flash,.steam,.zzz{transform-box:fill-box;transform-origin:center}
.scene{border-radius:12px;overflow:hidden;border:1px solid var(--line);margin:-4px 0 0}
.scene svg{display:block;width:100%;height:auto}
.scene-cap{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);padding:6px 2px 0}
.mapbox.traveling .maphint{background:var(--sun-soft);border-color:var(--sun);color:var(--ink);font-weight:600}
/* Bưu thiếp ảnh */
.pc{background:var(--surface);color:var(--ink);border-radius:16px;max-width:520px;width:100%;overflow:hidden;border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.28)}
.pframe{position:relative;aspect-ratio:4/3;background:var(--surface-2);overflow:hidden;max-width:100%}
.pframe>svg,.pframe>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
img.ph{opacity:0;transition:opacity .45s}
img.ph.ok{opacity:1}
.ptag{position:absolute;left:12px;top:12px;background:var(--red);color:#fff;font:700 11px/1 var(--f-body);letter-spacing:.12em;padding:6px 10px;border-radius:4px}
.ptag.food{background:var(--sun);color:#1B1606}
.psrc{position:absolute;right:10px;top:12px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:3px 9px;border-radius:999px}
.sticker{position:absolute;right:12px;bottom:12px;width:88px;height:88px;border-radius:50%;background:#DDF2FA;border:3px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.3);overflow:hidden}
.sticker svg{width:100%;height:100%;display:block}
.pcb{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px}
.pcb h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;line-height:1.15;text-wrap:balance}
.pcb .meta{color:var(--muted);font-size:13.5px}
.pcb .credit{font-size:12px;color:var(--muted);min-height:1em}
.pcb .credit a{color:var(--jade)}
.pcb .cta{margin-top:8px}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.album button{padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2);text-align:left;min-width:0}
.album .th{position:relative;aspect-ratio:1;overflow:hidden}
.album .th>svg,.album .th>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.album span{display:block;font-size:11.5px;padding:5px 6px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.walkin{animation:walkin 1.4s ease-out both}
@keyframes walkin{from{transform:translateX(-150px)}to{transform:translateX(0)}}
.fadein{animation:fadein .45s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="hud"><div class="hud-in" id="hud"></div></header>
<main class="wrap">
  <section class="mapbox" aria-label="Bản đồ Việt Nam">
    <div id="map"></div>
    <div class="maphint" id="maphint">Chạm vào một điểm để chọn nơi đến</div>
  </section>
  <section class="panel" aria-label="Bảng hành động">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="pbody" id="pbody"></div>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="modalRoot"></div>

<script>
// ===== DỮ LIỆU ĐIỂM ĐẾN (giá tham khảo trong game) =====
// L: [tên, giá vé, năng lượng (âm = hồi), số giờ]  F: [món, giá]
const C=[
 {id:'hanoi',n:'Hà Nội',p:'TP. Hà Nội',lon:105.85,lat:21.03,lb:[-10,-4,'end'],rail:1,air:1,stay:250000,
  intro:'Thủ đô ngàn năm văn hiến, phố cổ 36 phố phường và những quán phở sớm mai.',
  L:[['Hồ Hoàn Kiếm & cầu Thê Húc',0,10,2],['Văn Miếu – Quốc Tử Giám',70000,10,2],['Phố cổ & cà phê trứng',35000,8,2]],
  F:[['Phở bò',55000],['Bún chả',50000]],job:['Phụ bán quán phở phố cổ',220000],
  q:['Văn Miếu được xây dựng vào năm nào?',['1070','1010','1428','1802'],0]},
 {id:'halong',n:'Hạ Long',p:'Quảng Ninh',lon:107.08,lat:20.95,lb:[9,4,'start'],rail:0,air:1,stay:300000,
  intro:'Hàng nghìn đảo đá vôi nhô lên giữa làn nước xanh ngọc.',
  L:[['Du thuyền ngắm vịnh',350000,12,4],['Chèo kayak qua hang Luồn',150000,20,2],['Leo đỉnh đảo Ti Tốp',50000,20,2]],
  F:[['Chả mực Hạ Long',90000],['Bánh cuốn chả mực',45000]],job:['Phụ bếp nhà hàng hải sản',230000],

// ===== TRẠNG THÁI =====
const KEY='xuyenvietky.v1';
let S=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}

const vnd=n=>Math.round(n).toLocaleString('vi-VN')+'đ';
const dayOf=h=>Math.floor(h/24)+1;
const clock=h=>{const m=Math.round((h%24)*60);return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const stamp=()=>'N'+dayOf(S.hours)+' '+clock(S.hours);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hav(a,b){const R=6371,r=Math.PI/180,dLa=(b.lat-a.lat)*r,dLo=(b.lon-a.lon)*r;
 const x=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
const roadKm=(a,b)=>Math.round(hav(a,b)*1.25);
const total=()=>C.length+C.reduce((s,c)=>s+c.L.length+c.F.length,0);
const doneCount=()=>Object.keys(S.visited).length+Object.keys(S.done).length;

function newGame(name,arch,start){
 const A=ARCH[arch];
 S={name:name||'Lữ khách',arch,money:A.money,maxE:A.maxE,energy:A.maxE,hours:8,city:start,
    visited:{[start]:1},done:{},quiz:{},work:{},route:[start],log:[],tab:'here',dest:null};
 addLog('Bắt đầu hành trình xuyên Việt tại '+BY[start].n+' với '+vnd(A.money)+'.','good');
 save();render();
}
function addLog(t,cls=''){S.log.unshift({d:stamp(),t,c:cls});S.log=S.log.slice(0,60)}

let tt;function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),2600)}

// ===== DI CHUYỂN =====
function modes(a,b){
 const km=roadKm(a,b),isl=a.island||b.island,out=[];
 const r=v=>Math.round(v/1000)*1000, h2=v=>Math.round(v*2)/2;
 let c=km*500,e=km/18,h=km/40;
 if(S.arch==='phuot'){c*=.6;e*=.7}
 if(isl){c+=350000;h+=3}
 out.push({k:'moto',n:'Xe máy',sub:isl?'kèm phà ra đảo':'tự lái, đi phượt',c:r(c),e:Math.ceil(e),h:h2(h)});
 c=60000+km*850;e=km/45+3;h=km/45+.5;if(isl){c+=330000;h+=3}
 out.push({k:'bus',n:'Xe khách',sub:isl?'kèm tàu cao tốc':'giường nằm',c:r(c),e:Math.ceil(e),h:h2(h)});
 if(a.rail&&b.rail&&!isl) out.push({k:'train',n:'Tàu hỏa',sub:'tuyến Thống Nhất',c:r(50000+km*1000),e:Math.ceil(km/90+2),h:h2(km/48+.5)});
 if(a.air&&b.air&&km>300) out.push({k:'plane',n:'Máy bay',sub:'vé phổ thông',c:r(500000+km*450),e:8,h:h2(2.5+km/750)});
 return {km,list:out};
}
let busy=false;
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
function travel(k){
 if(busy)return;
 const a=BY[S.city],b=BY[S.dest];if(!b)return;
 const m=modes(a,b).list.find(x=>x.k===k);if(!m)return;
 if(S.money<m.c)return toast('Không đủ tiền. Hãy làm thêm hoặc chọn phương tiện rẻ hơn.');
 if(S.energy<m.e)return toast('Không đủ năng lượng. Nghỉ ngơi trước khi đi.');
 if(REDUCE)return arrive(a,b,m);
 busy=true;
 const start=()=>animateTravel(a,b,m,()=>{busy=false;arrive(a,b,m)});
 if(innerWidth<=860){document.querySelector('.mapbox').scrollIntoView({behavior:'smooth',block:'center'});setTimeout(start,450)}else start();
}
function animateTravel(a,b,m,done){
 const box=document.querySelector('.mapbox'),hint=document.getElementById('maphint'),hero=document.getElementById('hero');
 const [x1,y1]=px(a.lon,a.lat),[x2,y2]=px(b.lon,b.lat),dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy);
 const dur=Math.max(1600,Math.min(3600,1200+len*7)),flip=dx<0,plane=m.k==='plane';
 const arcH=plane?Math.min(70,len*.3):Math.min(14,len*.06);
 box.classList.add('traveling');hint.textContent='Đang đi '+m.n.toLowerCase()+' đến '+b.n+'…';
 const svg=box.querySelector('svg');
 svg.querySelectorAll('.pulse,.here-ring').forEach(e=>e.remove());
 const trail=document.createElementNS('http://www.w3.org/2000/svg','polyline');trail.setAttribute('class','route');svg.insertBefore(trail,hero);
 hero.innerHTML='<g transform="scale(1.35)">'+vehicleSVG(m.k,flip)+'</g>';
 const veh=hero.querySelector('.veh');let pts=[];const t0=performance.now();
 (function step(now){
  const t=Math.min(1,(now-t0)/dur),p=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  const off=-Math.sin(Math.PI*p)*arcH,x=x1+dx*p,y=y1+dy*p+off;
  hero.setAttribute('transform',`translate(${x.toFixed(1)},${y.toFixed(1)})`);
  if(plane){const dOff=-Math.PI*Math.cos(Math.PI*p)*arcH,ang=Math.atan2(dy+dOff,dx)*180/Math.PI;
   veh.setAttribute('transform',flip?`rotate(${ang+180}) scale(-1,1)`:`rotate(${ang})`)}
  pts.push(x.toFixed(1)+','+y.toFixed(1));trail.setAttribute('points',pts.join(' '));
  if(t<1)requestAnimationFrame(step);else setTimeout(()=>{box.classList.remove('traveling');done()},300);
 })(t0);
}
function arrive(a,b,m){
 S.money-=m.c;S.energy-=m.e;S.hours+=m.h;S.city=b.id;S.route.push(b.id);
 const first=!S.visited[b.id];if(first)S.visited[b.id]=dayOf(S.hours);
 addLog('Đi '+m.n.toLowerCase()+' từ '+a.n+' đến '+b.n+' ('+vnd(m.c)+', '+m.h+' giờ).');
 let msg='Đã đến '+b.n+(first?'. Nhận dấu hộ chiếu mới!':'.');
 if(Math.random()<.35){const ev=EV[Math.floor(Math.random()*EV.length)];
  S.money=Math.max(0,S.money+ev[1]);S.energy=Math.max(0,Math.min(S.maxE,S.energy+ev[2]));S.hours+=ev[3];
  const fx=[ev[1]?(ev[1]>0?'+':'')+vnd(ev[1]):'',ev[2]?(ev[2]>0?'+':'')+ev[2]+' năng lượng':'',ev[3]?'+'+ev[3]+' giờ':''].filter(Boolean).join(', ');
  addLog('Dọc đường: '+ev[0]+' ('+fx+').',(ev[1]<0||ev[2]<0||ev[3]>0)?'bad':'good');msg+=' Dọc đường: '+ev[0].toLowerCase()+'.'}
 S.dest=null;S.tab='here';FX={type:'arrive',text:'Đã đến '+b.n+' rồi!'};save();render();toast(msg);
 if(innerWidth<=860)setTimeout(()=>document.querySelector('.panel').scrollIntoView({behavior:'smooth',block:'start'}),300);
 clearFX();
}

function bubble(text){
 const t=text.length>34?text.slice(0,33)+'…':text,w=Math.min(250,t.length*6.6+22),x=Math.min(132,388-w);
 return `<g class="pop"><rect x="${x}" y="28" width="${w}" height="28" rx="14" fill="#FFFFFF" stroke="#1B2622" stroke-width="1.2"/><path d="M${x+14} 55 L${x+4} 70 L${x+26} 55 Z" fill="#FFFFFF" stroke="#1B2622" stroke-width="1.2"/><rect x="${x+12}" y="53" width="16" height="3" fill="#FFFFFF"/><text x="${x+w/2}" y="46.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1B2622" font-family="Be Vietnam Pro, system-ui, sans-serif">${esc(t)}</text></g>`;
}
function renderScene(){
 const el=document.getElementById('scene');if(!el)return;
 const c=BY[S.city],hr=S.hours%24,sleep=FX&&FX.type==='sleep';
 const night=sleep||hr>=19.5||hr<5,dusk=!night&&(hr>=17||hr<6);
 const pose={arrive:'wave',photo:'photo raise',eat:'eat',work:'work walk',quizok:'wave',quizbad:''}[FX&&FX.type]||'';
 const hero=sleep
  ?`<g transform="translate(110,176)">${P('M-40 0 L0 -50 L40 0 Z','#2E6DB4')}${P('M-12 0 L0 -30 L12 0 Z','#1B3E6B')}${['Z','z','Z'].map((z,i)=>`<text class="zzz" style="animation-delay:${i*.45}s" x="${30+i*10}" y="${-50-i*12}" font-size="${16-i*3}" font-weight="700" fill="#FFFFFF">${z}</text>`).join('')}</g>`
  :`<g transform="translate(110,178) scale(2.7)"><g class="breathe">${heroSVG(pose)}</g></g>`;
 el.innerHTML=`<svg viewBox="0 0 400 190" role="img" aria-label="Nhân vật tại ${esc(c.n)}">${sky(night,dusk)}${(SCN[c.id]||SCN.hanoi)()}${night?R(0,0,400,190,'#0A1430','opacity=".35"'):''}${hero}${FX&&FX.text?bubble(FX.text):''}</svg>
  <div class="scene-cap"><span>${esc(S.name)} đang ở ${esc(c.n)}</span><span class="num">Ngày ${dayOf(S.hours)} · ${clock(S.hours)}</span></div>`;
}

// ===== HÀNH ĐỘNG TẠI ĐIỂM =====
function checkin(i){
 const c=BY[S.city],l=c.L[i],k=c.id+':L'+i;if(S.done[k])return;
 if(S.money<l[1])return toast('Không đủ tiền mua vé.');
 if(l[2]>0&&S.energy<l[2])return toast('Bạn quá mệt để tham quan. Nghỉ ngơi đã.');
 S.money-=l[1];S.energy=Math.min(S.maxE,S.energy-l[2]);S.hours+=l[3];S.done[k]=dayOf(S.hours);
 addLog('Check-in '+l[0]+' ('+c.n+').','good');act('photo','Check-in '+l[0]+'!');save();render();
 postcard(k);
}
function eat(i){
 const c=BY[S.city],f=c.F[i],k=c.id+':F'+i;
 if(S.money<f[1])return toast('Không đủ tiền ăn món này.');
 const gain=S.arch==='foodie'?25:15;
 S.money-=f[1];S.energy=Math.min(S.maxE,S.energy+gain);S.hours+=1;
 let msg='Thưởng thức '+f[0]+'. +'+gain+' năng lượng.';
 if(S.arch==='foodie'&&!S.done[k]){S.money+=60000;msg+=' Bài review được trả 60.000đ.'}
 if(!S.done[k]){S.done[k]=dayOf(S.hours);addLog('Ăn '+f[0]+' tại '+c.n+'.','good')}
act('eat','Ngon quá! '+f[0]);
 save();render();toast(msg);
 postcard(k);
}
function work(){
 const c=BY[S.city],key=c.id+':'+dayOf(S.hours),n=S.work[key]||0;
 if(n>=2)return toast('Hôm nay bạn đã làm đủ 2 ca ở đây.');
 if(S.energy<25)return toast('Cần ít nhất 25 năng lượng để đi làm.');
 const pay=Math.round(c.job[1]*(S.arch==='sinhvien'?1.4:1)/1000)*1000;
 S.energy-=25;S.hours+=4;S.money+=pay;S.work[key]=n+1;
 addLog(c.job[0]+' tại '+c.n+', nhận '+vnd(pay)+'.','good');act('work','Xong ca! +'+vnd(pay));save();render();toast('Làm xong ca, nhận '+vnd(pay)+'.');
}
function answer(txt){
 const c=BY[S.city];if(S.quiz[c.id]!==undefined)return;
 const ok=txt===c.q[1][c.q[2]],rw=S.arch==='sinhvien'?200000:100000;
 S.quiz[c.id]=ok;if(ok)S.money+=rw;
 addLog('Đố vui '+c.n+': '+(ok?'trả lời đúng, thưởng '+vnd(rw):'trả lời sai')+'.',ok?'good':'bad');
 act(ok?'quizok':'quizbad',ok?'Đúng rồi! +'+vnd(rw):'Ôi, sai mất rồi…');
 save();render();toast(ok?'Chính xác! +'+vnd(rw):'Sai rồi. Đáp án: '+c.q[1][c.q[2]]);
}
function rest(kind){
 const c=BY[S.city];
 if(kind==='inn'){
  if(S.money<c.stay)return toast('Không đủ tiền thuê phòng. Thử ngủ nhờ homestay.');
  S.money-=c.stay;S.energy=S.maxE;let t=Math.floor(S.hours/24)*24+31;if(t-S.hours>16)t-=24;if(t<=S.hours)t+=24;S.hours=t;
  addLog('Ngủ nhà nghỉ ở '+c.n+' ('+vnd(c.stay)+'). Năng lượng đầy.');act('sleep','');
 }else{
  S.energy=Math.min(S.maxE,S.energy+40);S.hours+=8;
  addLog('Ngủ nhờ homestay, phụ việc nhà đổi chỗ ngủ ở '+c.n+'.');act('sleep','');
 }
 save();render();stayScene(kind);
}

let PHOTOS={},CAN_UP=false,ASSETS=null,DB=null;
const wikiCache={};
try{Object.assign(wikiCache,JSON.parse(localStorage.getItem('xvk.wiki')||'{}'))}catch(e){}
function candidates(key){const [id,t]=key.split(':'),w=WK[id];if(!w||!t)return[];const i=+t.slice(1);return t[0]==='L'?(w.L[i]||[]):t[0]==='F'?(w.F[i]||[]):[]}
async function wiki(cand){
 if(cand in wikiCache)return wikiCache[cand];
 const i=cand.indexOf(':'),lang=cand.slice(0,i),title=cand.slice(i+1);
 try{
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),6000);
  const r=await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title.replace(/ /g,'_'))}`,{signal:ctl.signal});
  clearTimeout(tm);
  if(!r.ok){wikiCache[cand]=null;return null}
  const d=await r.json(),src=d.thumbnail&&d.thumbnail.source;
  const v=src?{src:src.replace(/\/\d+px-/,'/500px-'),fallback:src,credit:'Wikipedia · '+d.title,href:d.content_urls&&d.content_urls.desktop&&d.content_urls.desktop.page}:null;
  wikiCache[cand]=v;try{localStorage.setItem('xvk.wiki',JSON.stringify(wikiCache))}catch(e){}
  return v;
 }catch(e){return undefined} // bị chặn mạng: không lưu cache, dùng ảnh minh họa
}
const BUILTIN={"hanoi:F0": {"u": "/_blob/29efcfaa4e57aa53bad2932a308d8856", "c": "SerraKnightz · CC BY 4.0", "h": "https://commons.wikimedia.org/wiki/File:Bowl_of_Meatball_pho.jpg"}, "hagiang:L1": {"u": "/_blob/df10ca19e7b3a9b48ca5090998de6496", "c": "Khánh Hmoong · CC BY 2.0", "h": "https://commons.wikimedia.org/wiki/File:Ma_Pi_Leng_Pass_winding_road_Ha_Giang_Vietnam.jpg"}, "hagiang:F1": {"u": "/_blob/8d6df6226e948f9e1413e451f9cea9f1", "c": "Casablanca1911 at vi.wikipedia · Public domain", "h": "https://commons.wikimedia.org/wiki/File:B%C3%A1nh_cu%E1%BB%91n_Thanh_Tr%C3%AC.jpg"}, "ninhbinh:L2": {"u": "/_blob/bb6b5d73020e1f7c3964312f900c9e66", "c": "Kien1980v (thảo luận) · Public domain", "h": "https://commons.wikimedia.org/wiki/File:Muaxuantamcoc.jpg"}, "ninhbinh:L1": {"u": "/_blob/289f30fcfa803fa69a5c3ffc25e296c6", "c": "VŨ HÙNG · CC BY-SA 3.0", "h": "https://commons.wikimedia.org/wiki/File:M%E1%BB%98T_G%C3%93C_CH%C3%99A_B%C3%81I_%C4%90%C3%8DNH_-_panoramio.jpg"}};
async function getPhoto(key){
 if(PHOTOS[key])return {src:'/_blob/'+PHOTOS[key],credit:'Ảnh do bạn tải lên'};
 const bi=window.claude&&window.claude.use&&BUILTIN[key];if(bi)return {src:bi.u,credit:bi.c+' · Wikimedia Commons',href:bi.h};
 for(const c of candidates(key)){const v=await wiki(c);if(v)return v;if(v===undefined)return null}
 return null;
}
function loadInto(el,key){
 getPhoto(key).then(p=>{
  if(!p||!el.isConnected)return;
  const img=el.querySelector('img');if(!img)return;
  img.onload=()=>{img.classList.add('ok');const s=el.querySelector('.psrc');if(s)s.textContent='Ảnh thật';
   const cr=el.id==='pframe'&&document.getElementById('pcredit');
   if(cr)cr.innerHTML=p.href?`Nguồn ảnh: <a href="${esc(p.href)}" target="_blank" rel="noopener">${esc(p.credit)}</a>`:esc(p.credit)};
  img.onerror=()=>{if(p.fallback&&img.src!==p.fallback)img.src=p.fallback};
  img.src=p.src;
 });
}
(async()=>{try{
 const cl=window.claude;if(!cl||!cl.use)return;
 const [db,assets,user]=await Promise.all([cl.use('db'),cl.use('assets'),cl.use('user')]);
 DB=db;ASSETS=assets;
 if(db)db.collection('photos').onSnapshot(snap=>{PHOTOS={};snap.docs.forEach(d=>{const v=d.data();if(v&&v.key&&v.id)PHOTOS[v.key]=v.id});if(S&&S.tab==='pass')render()},()=>{});
 CAN_UP=!!(assets&&db&&user&&await user.canEdit());
}catch(e){}})();
function doUpload(key){
 const inp=document.getElementById('upfile');if(!inp||!ASSETS||!DB)return;
 inp.onchange=async()=>{
  const f=inp.files[0];if(!f)return;
  if(!f.type.startsWith('image/'))return toast('Chỉ nhận file ảnh (JPG, PNG, WebP).');
  try{
   toast('Đang tải ảnh lên…');
   const r=await ASSETS.upload(f);
   await DB.collection('photos').doc(key.replace(/:/g,'-')).set({key,id:r.id});
   PHOTOS[key]=r.id;
   const fr=document.getElementById('pframe'),img=fr&&fr.querySelector('img');
   if(img){img.classList.remove('ok');img.onload=()=>{img.classList.add('ok');const s=fr.querySelector('.psrc');if(s)s.textContent='Ảnh thật'};img.src=r.url}
   const cr=document.getElementById('pcredit');if(cr)cr.textContent='Ảnh do bạn tải lên';
   toast('Đã lưu ảnh. Lần sau check-in sẽ hiện ảnh này.');
  }catch(e){toast('Không tải được ảnh. Thử file nhỏ hơn 20MB.')}
 };
 inp.click();
}

function stickerSVG(pose){return `<svg viewBox="-17 -44 34 47" aria-hidden="true">${heroSVG(pose)}</svg>`}

// --- Bưu thiếp check-in / món ăn ---
function postcard(key){
 const [id,t]=key.split(':'),c=BY[id],i=+t.slice(1),food=t[0]==='F',it=food?c.F[i]:c.L[i];
 const day=S.done[key]||dayOf(S.hours);
 const meta=food?`${esc(c.n)} · ${vnd(it[1])} · thưởng thức ngày ${day}`:`${esc(c.n)} · ${esc(c.p)} · check-in ngày ${day}`;
 const pose=food?'eat':'photo raise';
 document.getElementById('modalRoot').innerHTML=`<div class="modal" data-a="closebg"><div class="pc fadein" role="dialog" aria-label="${esc(it[0])}">
  <div class="pframe" id="pframe">${food?foodIllus(it[0]):illus(id)}<img class="ph" alt="${esc(it[0])}">
   <span class="ptag${food?' food':''}">${food?'ĐẶC SẢN':'CHECK-IN'}</span><span class="psrc">Ảnh minh họa</span>
   <div class="sticker">${stickerSVG(pose)}</div></div>
  <div class="pcb"><h2>${esc(it[0])}</h2><div class="meta">${meta}</div><div class="credit" id="pcredit"></div>
   <input type="file" accept="image/*" id="upfile" hidden>
   <div class="cta">${CAN_UP?`<button class="btn out" data-a="upload" data-id="${key}">${PHOTOS[key]?'Đổi ảnh':'Thêm ảnh thật'}</button>`:''}<button class="btn" data-a="close">Tiếp tục hành trình</button></div></div></div></div>`;
 loadInto(document.getElementById('pframe'),key);
}

function stayScene(kind){
 const c=BY[S.city],key=c.id+':'+kind,inn=kind==='inn';
 document.getElementById('modalRoot').innerHTML=`<div class="modal" data-a="closebg"><div class="pc fadein" role="dialog" aria-label="Nghỉ đêm">
  <div class="pframe" id="pframe">${stayExt(kind)}<img class="ph" alt="">
   <span class="ptag">${inn?'NHẬN PHÒNG':'NGỦ NHỜ HOMESTAY'}</span><span class="psrc">Ảnh minh họa</span></div>
  <div class="pcb"><h2>${inn?'Nhà nghỉ ở '+esc(c.n):'Homestay nhà dân ở '+esc(c.n)}</h2>
   <div class="meta">${inn?`Phòng đôi ${vnd(c.stay)} · ngủ đến ${clock(S.hours)} ngày ${dayOf(S.hours)} · năng lượng đầy`:'Phụ chủ nhà nấu cơm, rửa bát để đổi chỗ ngủ · +40 năng lượng'}</div>
   <div class="credit" id="pcredit"></div><input type="file" accept="image/*" id="upfile" hidden>
   <div class="cta">${CAN_UP?`<button class="btn out" data-a="upload" data-id="${key}">${PHOTOS[key]?'Đổi ảnh':'Thêm ảnh thật'}</button>`:''}<button class="btn" data-a="close">Thức dậy, đi tiếp</button></div></div></div></div>`;
 const fr=document.getElementById('pframe');
 setTimeout(()=>{if(fr.isConnected&&!fr.querySelector('img.ok')){fr.querySelector('svg').outerHTML=stayInt(kind)}},REDUCE?0:1900);
 loadInto(fr,key);

// --- Album trong hộ chiếu ---
function albumView(){
 const keys=Object.keys(S.done).filter(k=>/:[LF]\d+$/.test(k));
 if(!keys.length)return `<div class="sec"><h3>Album ảnh</h3><p class="note" style="margin:0">Chưa có ảnh. Check-in hoặc ăn đặc sản để lưu bưu thiếp vào album.</p></div>`;
 return `<div class="sec"><h3>Album ảnh · ${keys.length}</h3><div class="album">${keys.map(k=>{const [id,t]=k.split(':'),c=BY[id],i=+t.slice(1),f=t[0]==='F',it=f?c.F[i]:c.L[i];
  return `<button data-a="view" data-id="${k}" aria-label="${esc(it[0])}"><div class="th" data-k="${k}">${f?foodIllus(it[0]):illus(id)}<img class="ph" alt="" loading="lazy"></div><span>${esc(it[0])}</span></button>`}).join('')}</div></div>`;
}

// ===== MODAL =====
function setupModal(){
 document.getElementById('modalRoot').innerHTML=`<div class="modal"><form class="card" id="setup">
  <h1>Xuyên Việt Ký</h1>
  <p class="lead">Nhập vai một lữ khách với ngân sách ít ỏi. Đi khắp ${C.length} điểm đến từ Hà Giang đến Phú Quốc, check-in, ăn đặc sản, làm thêm kiếm lộ phí và sưu tầm dấu hộ chiếu.</p>
  <div class="field"><label for="pname">Tên nhân vật</label><input id="pname" maxlength="24" value="Lữ khách"></div>
  <div class="field"><label>Chọn vai</label><div class="arch">${Object.entries(ARCH).map(([k,a],i)=>`<label><input type="radio" name="arch" id="arch-${k}" value="${k}" ${i===0?'checked':''}><b>${a.n}</b><span>${a.d}</span></label>`).join('')}</div></div>
  <div class="field"><label for="pstart">Xuất phát từ</label><select id="pstart"><option value="hanoi">Hà Nội</option><option value="hcm">TP.HCM</option></select></div>
  <div class="cta"><button class="btn big" type="submit">Lên đường</button></div></form></div>`;
 document.getElementById('setup').addEventListener('submit',e=>{e.preventDefault();
  const arch=document.querySelector('input[name=arch]:checked').value;
  newGame(document.getElementById('pname').value.trim(),arch,document.getElementById('pstart').value);
  document.getElementById('modalRoot').innerHTML='';});
}
function resetModal(){
 document.getElementById('modalRoot').innerHTML=`<div class="modal"><div class="card"><h1 style="font-size:24px">Chơi lại từ đầu?</h1><p class="lead">Toàn bộ tiến trình, tiền và dấu hộ chiếu hiện tại sẽ bị xóa.</p><div class="cta"><button class="btn out" data-a="close">Giữ hành trình</button><button class="btn" style="background:var(--red)" data-a="confirmReset">Xóa và chơi lại</button></div></div></div>`;
}

// ===== SỰ KIỆN =====
document.addEventListener('click',e=>{
 if(busy)return;
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
 if(a==='tab'){S.tab=id;save();render()}
 else if(a==='pick'){if(id===S.city){S.tab='here'}else{S.dest=id;S.tab='go'}save();render()}
 else if(a==='go')travel(id);
 else if(a==='checkin')checkin(+id);
 else if(a==='eat')eat(+id);
 else if(a==='work')work();
 else if(a==='ans')answer(id);
 else if(a==='rest')rest(id);
 else if(a==='reset')resetModal();
 else if(a==='close')document.getElementById('modalRoot').innerHTML='';
 else if(a==='closebg'){if(e.target===b)document.getElementById('modalRoot').innerHTML=''}
 else if(a==='view')postcard(id);
 else if(a==='upload')doUpload(id);
 else if(a==='confirmReset'){try{localStorage.removeItem(KEY)}catch(e){}document.getElementById('modalRoot').innerHTML='';setupModal()}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('g[data-a]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});

// ===== KHỞI ĐỘNG =====
S=load();
if(S){render()}else{
 // Màn hình mẫu phía sau form tạo nhân vật
 S={name:'Lữ khách',arch:'phuot',money:2000000,maxE:100,energy:100,hours:8,city:'hanoi',visited:{hanoi:1},done:{},quiz:{},work:{},route:['hanoi'],log:[],tab:'here',dest:null};
 render();S=null;setupModal();
}
</script>

<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
